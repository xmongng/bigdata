name: vnnews-v2-staging
x-app: &app
  env_file:
    - ${V2_ENV_FILE:?set V2_ENV_FILE}
  mem_limit: 512m
  restart: unless-stopped
  logging:
    options:
      max-size: '10m'
      max-file: '3'
services:
  ingestion-v2:
    <<: *app
    build:
      context: ../../services/ingestion-api
    ports: ["127.0.0.1:18000:8000"]
    volumes: ["v2-outbox:/state/v2"]
  query-v2:
    <<: *app
    build:
      context: ../../services/query-api
    ports: ["127.0.0.1:18001:8000"]
  trino-v2:
    <<: *app
    image: ${V2_TRINO_IMAGE:?set V2_TRINO_IMAGE to a reviewed version}
    mem_limit: 2g
    ports: ["127.0.0.1:18080:8080"]
    volumes:
      - ../../trino/catalog/lake_v2.properties:/etc/trino/catalog/lake_v2.properties:ro
networks:
  default:
    name: vnnews-v2-staging
volumes:
  v2-outbox: {}
