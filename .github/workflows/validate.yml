name: Validate Lakehouse V2
on:
  pull_request:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  local-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node scripts/scan-secrets.mjs --staged
      - run: python -m pip install -r requirements-test.txt
      - run: python -B scripts/test_apis.py
      - run: python -B -m unittest discover -s tests
        working-directory: pipelines/spark
      - run: bash scripts/check-local.sh
