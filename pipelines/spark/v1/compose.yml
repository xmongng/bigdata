
name: vn-news-spark

x-spark-common: &spark-common
  image: vn-news-spark:3.5.7
  pull_policy: never
  restart: unless-stopped
  networks:
    - spark-network

services:
  spark-master:
    <<: *spark-common
    container_name: spark-master
    hostname: spark-master
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.master.Master
      - --host
      - spark-master
      - --port
      - "7077"
      - --webui-port
      - "8080"
    ports:
      - "7077:7077"
      - "8080:8080"
    mem_limit: 512m
    cpus: 0.5

  spark-worker:
    <<: *spark-common
    container_name: spark-worker
    depends_on:
      - spark-master
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - spark://spark-master:7077
      - --cores
      - "2"
      - --memory
      - 1g
      - --webui-port
      - "8081"
    ports:
      - "8081:8081"
    mem_limit: 2g
    cpus: 2.0

  spark-streaming:
    <<: *spark-common
    container_name: spark-streaming
    hostname: spark-streaming
    depends_on:
      - spark-master
      - spark-worker
    restart: "no"
    working_dir: /app
    env_file:
      - ${SPARK_V1_ENV_FILE:?set SPARK_V1_ENV_FILE}
    environment:
      PYSPARK_PYTHON: python3
      AWS_REGION: us-east-1
    volumes:
      - type: bind
        source: ../reference/streaming_job.py
        target: /app/streaming_job.py
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${SPARK_V1_CHECKPOINTS_DIR:?set SPARK_V1_CHECKPOINTS_DIR}
        target: /root/news-spark/checkpoints
        bind:
          create_host_path: false
      - type: bind
        source: ${SPARK_V1_JARS_DIR:?set SPARK_V1_JARS_DIR}
        target: /opt/local-jars
        read_only: true
        bind:
          create_host_path: false
      - ./launch-offline.sh:/app/launch-offline.sh:ro
      - ./offline-smoke.py:/app/offline-smoke.py:ro
    command: [bash, /app/launch-offline.sh]
    mem_limit: 2g
    cpus: 1.5

networks:
  spark-network:
    driver: bridge
