connector.name=iceberg
iceberg.catalog.type=rest
iceberg.rest-catalog.uri=${ENV:POLARIS_URI}
iceberg.rest-catalog.warehouse=${ENV:POLARIS_WAREHOUSE}
iceberg.rest-catalog.security=OAUTH2
iceberg.rest-catalog.oauth2.credential=${ENV:POLARIS_OAUTH_CREDENTIAL}
iceberg.rest-catalog.oauth2.server-uri=${ENV:POLARIS_OAUTH_URL}
iceberg.rest-catalog.oauth2.scope=PRINCIPAL_ROLE:ALL
iceberg.rest-catalog.http-headers=Polaris-Realm: POLARIS
iceberg.rest-catalog.vended-credentials-enabled=false
fs.s3.enabled=true
s3.endpoint=${ENV:MINIO_ENDPOINT}
s3.path-style-access=true
s3.region=us-east-1
s3.aws-access-key=${ENV:MINIO_ACCESS_KEY}
s3.aws-secret-key=${ENV:MINIO_SECRET_KEY}
